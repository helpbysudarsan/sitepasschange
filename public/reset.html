<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Cyber Reset - IIA Fest</title>

    <!-- SweetAlert2 & Firebase Libraries -->
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>

    <style>
        /* =========================================
           CYBER THEME VARIABLES
           ========================================= */
        :root {
            --neon-cyan: #00f0ff;
            --neon-magenta: #d900ff;
            --dark-bg: #050510;
            --panel-bg: rgba(10, 15, 30, 0.75);
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --input-bg: rgba(0, 0, 0, 0.6);
            --input-border: #1e293b;
        }

        body { 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; 
            background-color: var(--dark-bg); 
            margin: 0; padding: 15px; 
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            min-height: 100vh; color: var(--text-main); position: relative; overflow-x: hidden;
        }

        /* =========================================
           CYBER BACKGROUND EFFECTS
           ========================================= */
        /* Holographic Grid */
        .cyber-grid {
            position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; z-index: -3;
            background-image: 
                linear-gradient(rgba(0, 240, 255, 0.05) 1px, transparent 1px),
                linear-gradient(90deg, rgba(0, 240, 255, 0.05) 1px, transparent 1px);
            background-size: 40px 40px;
        }

        /* Vertical Scanner Line */
        .scanner-line {
            position: fixed; top: -10%; left: 0; width: 100vw; height: 3px;
            background: var(--neon-cyan);
            box-shadow: 0 0 15px 2px var(--neon-cyan);
            z-index: -1; opacity: 0.5;
            animation: scan 6s linear infinite;
        }
        @keyframes scan {
            0% { top: -10%; }
            100% { top: 110%; }
        }

        /* Ambient Glowing Orbs */
        .orb { position: absolute; border-radius: 50%; filter: blur(90px); z-index: -2; opacity: 0.3; }
        .orb-1 { width: 350px; height: 350px; background: var(--neon-cyan); top: 5%; left: 10%; animation: float 8s ease-in-out infinite alternate; }
        .orb-2 { width: 300px; height: 300px; background: var(--neon-magenta); bottom: 5%; right: 10%; animation: float 10s ease-in-out infinite alternate-reverse; }

        @keyframes float {
            0% { transform: translate(0, 0) scale(1); }
            100% { transform: translate(30px, 40px) scale(1.1); }
        }

        /* =========================================
           GLASSMORPHISM CYBER PANEL
           ========================================= */
        .container { width: 100%; max-width: 420px; position: relative; z-index: 2; }
        .panel { 
            background: var(--panel-bg); 
            border-radius: 16px; 
            backdrop-filter: blur(20px); 
            border: 1px solid rgba(0, 240, 255, 0.3); 
            box-shadow: 0 0 30px rgba(0, 240, 255, 0.1), inset 0 0 20px rgba(0, 240, 255, 0.05);
            padding: 40px 30px; 
            text-align: center; 
            position: relative;
            overflow: hidden;
        }
        
        /* Top Glowing Edge */
        .panel::before {
            content: ''; position: absolute; top: 0; left: 10%; width: 80%; height: 2px;
            background: linear-gradient(90deg, transparent, var(--neon-cyan), transparent);
        }

        /* Clean, Normal Text Settings */
        h2 { 
            color: #ffffff; 
            text-shadow: 0 0 8px var(--neon-cyan); 
            margin-top: 0; margin-bottom: 5px; 
            font-size: 1.8rem; font-weight: 800; letter-spacing: 1px;
        }
        p { color: var(--text-muted); font-size: 0.95rem; margin-bottom: 25px; line-height: 1.5; font-weight: 500;}

        /* =========================================
           INPUTS & BUTTONS
           ========================================= */
        .password-container { position: relative; width: 100%; margin-bottom: 15px; }
        
        input { 
            width: 100%; padding: 15px 50px 15px 15px; margin: 0; 
            border: 1px solid var(--input-border); border-radius: 8px; 
            box-sizing: border-box; font-size: 1rem; 
            background-color: var(--input-bg); color: var(--text-main); 
            transition: all 0.3s ease; font-family: inherit;
        }
        input:focus { 
            outline: none; border-color: var(--neon-cyan); 
            box-shadow: 0 0 12px rgba(0, 240, 255, 0.2); 
            background-color: rgba(0, 240, 255, 0.05);
        }
        
        .eye-btn { 
            position: absolute; right: 15px; top: 50%; transform: translateY(-50%); 
            background: none; border: none; cursor: pointer; font-size: 1.2rem; 
            color: var(--text-muted); padding: 0; width: auto; transition: color 0.2s;
        }
        .eye-btn:hover { color: var(--neon-cyan); }

        button[type="submit"] { 
            background: linear-gradient(90deg, #00f0ff, #0284c7); 
            color: #ffffff; text-shadow: 0 1px 2px rgba(0,0,0,0.3);
            border: none; padding: 15px 20px; border-radius: 8px; 
            cursor: pointer; font-weight: bold; width: 100%; font-size: 1rem; 
            transition: all 0.3s; text-transform: uppercase; letter-spacing: 1px;
            margin-top: 10px; box-shadow: 0 0 15px rgba(0, 240, 255, 0.3);
        }
        button[type="submit"]:hover { 
            box-shadow: 0 0 25px rgba(0, 240, 255, 0.5); 
            transform: translateY(-2px); 
        }
        button[type="submit"]:active { transform: translateY(1px); }
        button:disabled { opacity: 0.6; cursor: not-allowed; transform: none; box-shadow: none; }

        /* Status Messages */
        .status-msg { margin-top: 15px; font-weight: bold; padding: 12px; border-radius: 8px; text-align: center; font-size: 0.9rem; }
        .msg-error { background: rgba(239, 68, 68, 0.1); border: 1px solid #ef4444; color: #fca5a5; text-shadow: 0 0 4px rgba(239,68,68,0.4); }
        .hidden { display: none !important; }
        .spinner { display: inline-block; width: 16px; height: 16px; border: 2px solid rgba(255,255,255,0.3); border-radius: 50%; border-top-color: #fff; animation: spin 1s linear infinite; margin-left: 8px; vertical-align: middle; }
        @keyframes spin { 100% { transform: rotate(360deg); } }

        /* SweetAlert Cyber Theme Override */
        .swal2-popup { background: #0f172a !important; color: #f8fafc !important; border: 1px solid #00f0ff; box-shadow: 0 0 20px rgba(0,240,255,0.2) !important; border-radius: 16px !important; }
        .swal2-title { color: #00f0ff !important; text-shadow: 0 0 8px rgba(0,240,255,0.5); }
    </style>
</head>
<body>

<!-- CYBER BACKGROUND ELEMENTS -->
<div class="cyber-grid"></div>
<div class="scanner-line"></div>
<div class="orb orb-1"></div>
<div class="orb orb-2"></div>

<div class="container">
    <div class="panel">
        <h2>Reset Password</h2>
        <p id="userEmailDisplay">Verifying secure connection...</p>
        
        <form id="formResetPass">
            <div class="password-container">
                <input type="password" id="newPass" placeholder="Enter New Password" required>
                <button type="button" class="eye-btn" onclick="togglePassword('newPass', this)">👁️</button>
            </div>
            <div class="password-container">
                <input type="password" id="confirmPass" placeholder="Confirm New Password" required>
                <button type="button" class="eye-btn" onclick="togglePassword('confirmPass', this)">👁️</button>
            </div>
            
            <button type="submit" id="resetBtn">Update Security Key</button>
            <div id="resetError" class="status-msg msg-error hidden"></div>
        </form>
    </div>
</div>

<script>
    // 1. Initialize Firebase (আপনার প্রোজেক্টের ডিটেইলস)
    const firebaseConfig = {
      apiKey: "AIzaSyAvtM_LmkN4oXlQ7_wojG8CunUuw6lbt7Y",
      authDomain: "iia-fest.firebaseapp.com",
      projectId: "iia-fest",
      storageBucket: "iia-fest.firebasestorage.app",
      messagingSenderId: "111712260847",
      appId: "1:111712260847:web:667572c9309a011b02811a"
    };
    firebase.initializeApp(firebaseConfig);
    const auth = firebase.auth();

    function togglePassword(fieldId, btn) {
        const input = document.getElementById(fieldId);
        if (input.type === "password") { input.type = "text"; btn.innerText = "🙈"; } 
        else { input.type = "password"; btn.innerText = "👁️"; }
    }

    document.addEventListener("DOMContentLoaded", () => {
        // 2. URL থেকে সিক্রেট কোড (oobCode) বের করা
        const urlParams = new URLSearchParams(window.location.search);
        const actionCode = urlParams.get('oobCode');

        if (!actionCode) {
            Swal.fire({ icon: 'error', title: 'Invalid Link', text: 'The security reset link is missing, invalid, or has expired.', allowOutsideClick: false });
            document.getElementById('resetBtn').disabled = true;
            document.getElementById('userEmailDisplay').innerText = "Access Denied.";
            return;
        }

        // 3. কোডটি ভেরিফাই করে ইমেইল দেখানো
        auth.verifyPasswordResetCode(actionCode).then((email) => {
            document.getElementById('userEmailDisplay').innerHTML = `Authorized for:<br> <span style="color:#00f0ff; font-weight:bold;">${email}</span>`;
        }).catch((error) => {
            Swal.fire('Error', 'Invalid or expired secure link. Please request a new one from the portal.', 'error');
            document.getElementById('resetBtn').disabled = true;
            document.getElementById('userEmailDisplay').innerText = "Link Expired.";
        });

        // 4. ফর্ম সাবমিট ও পাসওয়ার্ড আপডেট লজিক
        document.getElementById('formResetPass').addEventListener('submit', (e) => {
            e.preventDefault();
            const p1 = document.getElementById('newPass').value;
            const p2 = document.getElementById('confirmPass').value;
            const errBox = document.getElementById('resetError');

            if(p1.length < 6) {
                errBox.innerText = "Password must be at least 6 characters.";
                errBox.classList.remove('hidden'); return;
            }
            if(p1 !== p2) {
                errBox.innerText = "Passwords do not match.";
                errBox.classList.remove('hidden'); return;
            }
            
            errBox.classList.add('hidden');
            const btn = document.getElementById('resetBtn');
            btn.innerHTML = 'Processing... <div class="spinner"></div>';
            btn.disabled = true;

            auth.confirmPasswordReset(actionCode, p1).then(() => {
                Swal.fire({
                    icon: 'success',
                    title: 'System Updated!',
                    text: 'Your security key has been changed successfully. You can now log into the portal.',
                    confirmButtonColor: '#00f0ff',
                    confirmButtonText: '<span style="color:#000; font-weight:bold;">Go to Login</span>'
                }).then(() => {
                    window.location.href = 'index.html'; 
                });
            }).catch((error) => {
                errBox.innerText = error.message;
                errBox.classList.remove('hidden');
                btn.innerText = 'Update Security Key';
                btn.disabled = false;
            });
        });
    });
</script>
</body>
</html>
